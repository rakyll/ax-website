<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="AX home">
      <img src="{{ "axolotl.svg" | relURL }}" alt="" width="45" height="30">
      <span>AX</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      {{ range .Site.Menus.main }}
      {{- $external := hasPrefix .URL "http" -}}
      <a href="{{ if $external }}{{ .URL }}{{ else }}{{ .URL | relURL }}{{ end }}"
         {{ if $external }}rel="noopener"{{ end }}
         {{ if and (not $external) ($.IsMenuCurrent "main" .) }}class="active"{{ else if and (not $external) ($.HasMenuCurrent "main" .) }}class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
